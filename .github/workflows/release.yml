name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.4.0"
        required: true
        type: string
      signed_keyboard_driver_url:
        description: "URL to the Microsoft/trusted signed AppleKeyboardFilterDriver.zip"
        required: false
        type: string
      signed_keyboard_driver_sha256:
        description: "Expected SHA-256 of the signed keyboard driver zip"
        required: false
        type: string
      require_signed_keyboard_driver:
        description: "Fail unless a signed keyboard driver zip is supplied"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        shell: pwsh
        run: |
          dotnet build ApplePeripheralsForWindows.sln -c Release
          dotnet run --project src/MagicTrackpad.App/MagicTrackpad.App.csproj -c Release -- --self-test
          python -m unittest discover -s tests

      - name: Prepare signed keyboard driver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts\release | Out-Null

          $url = "${{ inputs.signed_keyboard_driver_url }}"
          $expectedHash = "${{ inputs.signed_keyboard_driver_sha256 }}"
          $requireSignedDriver = [bool]::Parse("${{ inputs.require_signed_keyboard_driver }}")
          $driverZip = "artifacts\release\AppleKeyboardFilterDriver-signed.zip"

          if ([string]::IsNullOrWhiteSpace($url)) {
            if ($requireSignedDriver) {
              throw "A signed_keyboard_driver_url is required for a full Globe/Fn release."
            }

            "KEYBOARD_DRIVER_ZIP=" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          Invoke-WebRequest -Uri $url -OutFile $driverZip
          if (![string]::IsNullOrWhiteSpace($expectedHash)) {
            $actualHash = (Get-FileHash -LiteralPath $driverZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
              throw "Keyboard driver SHA-256 mismatch. Expected $expectedHash but got $actualHash."
            }
          }

          powershell -ExecutionPolicy Bypass -File .\scripts\verify-keyboard-driver-package.ps1 -ZipPath $driverZip -RequireAllArchitectures -RequireMicrosoftSignature
          "KEYBOARD_DRIVER_ZIP=$driverZip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ inputs.version }}"
          if (!$tag.StartsWith("v", [StringComparison]::OrdinalIgnoreCase)) {
            $tag = "v$tag"
          }
          $versionNumber = $tag -replace "^[vV]", ""
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

          foreach ($runtime in @("win-x64", "win-arm64")) {
            $outDir = "artifacts\installer-$runtime"
            $args = @(
              "-ExecutionPolicy", "Bypass",
              "-File", ".\scripts\build-installer.ps1",
              "-Runtime", $runtime,
              "-Version", $versionNumber,
              "-OutputDir", $outDir
            )
            if (![string]::IsNullOrWhiteSpace($env:KEYBOARD_DRIVER_ZIP)) {
              $args += @("-KeyboardDriverZip", $env:KEYBOARD_DRIVER_ZIP, "-RequireKeyboardDriver")
            }

            powershell @args
            Copy-Item -LiteralPath (Join-Path $outDir "ApplePeripheralsSetup-$runtime.exe") -Destination artifacts\release -Force
          }

      - name: Write release notes
        shell: pwsh
        run: |
          $hasKeyboardDriver = ![string]::IsNullOrWhiteSpace($env:KEYBOARD_DRIVER_ZIP)
          $notes = @(
            "Apple Peripherals for Windows $env:RELEASE_TAG",
            "",
            "- Installs the native settings app and background bridge.",
            "- Requests Administrator approval because the installer adds bundled Windows drivers.",
            "- Bundles the Microsoft-signed Magic Trackpad Precision Touchpad driver.",
            "- Includes current Magic Keyboard modifier remapping, F-key mappings, and settings UI.",
            "- Adds a Magic Keyboard driver repair action from the keyboard status panel.",
            "- Records whether the installer bundles the signed keyboard filter so the app can show the right Globe/Fn action."
          )
          if ($hasKeyboardDriver) {
            $notes += "- Bundles a trusted signed Apple Keyboard Filter driver so Globe/Fn can map through the app setting."
          }
          else {
            $notes += ""
            $notes += "This release does not bundle the Apple Keyboard Filter driver. Globe/Fn remapping requires a separate trusted signed keyboard filter package."
          }

          $notes -join [Environment]::NewLine | Set-Content -Path artifacts\release-notes.md

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG artifacts\release\*.exe `
            --title "Apple Peripherals for Windows $env:RELEASE_TAG" `
            --notes-file artifacts\release-notes.md `
            --latest
