name: keyboard-driver

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keyboard-driver.yml"
      - "scripts/build-keyboard-filter-driver.ps1"
      - "scripts/build-keyboard-driver-submission-cab.ps1"
      - "src/AppleKeyboardFilter.Driver/**"

jobs:
  build:
    name: Build Apple keyboard filter (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            artifact-name: AppleKeyboardFilterDriver-AMD64-unsigned
          - platform: ARM64
            artifact-name: AppleKeyboardFilterDriver-ARM64-unsigned

    steps:
      - uses: actions/checkout@v4

      - name: Install Windows SDK and Driver Kit
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $downloads = Join-Path $env:RUNNER_TEMP "wdk-downloads"
          New-Item -ItemType Directory -Force -Path $downloads | Out-Null

          $sdkSetup = Join-Path $downloads "winsdksetup.exe"
          $wdkSetup = Join-Path $downloads "wdksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2338977" -OutFile $sdkSetup
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2335869" -OutFile $wdkSetup

          foreach ($setup in @($sdkSetup, $wdkSetup)) {
            $process = Start-Process -FilePath $setup -ArgumentList @("/quiet", "/norestart") -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) {
              throw "$setup failed with exit code $($process.ExitCode)."
            }
          }

      - name: Build driver package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-keyboard-filter-driver.ps1 -Platform ${{ matrix.platform }}

      - name: Upload unsigned driver package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            artifacts/keyboard-filter/**/*.inf
            artifacts/keyboard-filter/**/*.sys
            artifacts/keyboard-filter/**/*.cat
            artifacts/keyboard-filter/*.zip
          if-no-files-found: error

  package-submission-cab:
    name: Package attestation submission CAB
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download AMD64 driver package
        uses: actions/download-artifact@v4
        with:
          name: AppleKeyboardFilterDriver-AMD64-unsigned
          path: artifacts/keyboard-filter-input/AMD64

      - name: Download ARM64 driver package
        uses: actions/download-artifact@v4
        with:
          name: AppleKeyboardFilterDriver-ARM64-unsigned
          path: artifacts/keyboard-filter-input/ARM64

      - name: Build unsigned attestation CAB
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build-keyboard-driver-submission-cab.ps1 -Amd64Package .\artifacts\keyboard-filter-input\AMD64 -Arm64Package .\artifacts\keyboard-filter-input\ARM64

      - name: Upload unsigned attestation CAB
        uses: actions/upload-artifact@v4
        with:
          name: AppleKeyboardFilterDriver-attestation-cab-unsigned
          path: artifacts/keyboard-filter/AppleKeyboardFilterAttestation.cab
          if-no-files-found: error
